name: ASN CF Proxy Scanner (ASNIPtest-New)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 2'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan prips python3 curl jq wget

      # 1. 克隆 ASNIPtest-New 主项目
      - name: Clone ASNIPtest-New
        run: |
          git clone --depth 1 https://github.com/122440367/ASNIPtest-New.git scanner-src
          cd scanner-src
          chmod +x *.py 2>/dev/null || true

      # 2. 下载官方编译好的 cf-scanner 二进制
      - name: Download pre-compiled cf-scanner
        run: |
          # MortezaBashsiz 的 Golang 版本提供了现成的二进制
          # 下载并重命名为 cf-scanner，放入 scanner-src 目录
          wget -q https://github.com/MortezaBashsiz/CFScanner/releases/download/v1.0.9/cfscanner-linux -O scanner-src/cf-scanner
          
          # 赋予执行权限并验证
          chmod +x scanner-src/cf-scanner
          ls -la scanner-src/cf-scanner
          ./scanner-src/cf-scanner --help || true

      # 3. 运行主扫描脚本
      - name: Run ASN IP Scan
        run: |
          cd scanner-src
          
          TARGET_ASNS="AS62468" # 替换为你的目标 ASN
          echo "开始扫描 ASN: $TARGET_ASNS"
          
          # 以 root 身份运行，避免 masscan 和文件权限问题
          sudo python3 run.py $TARGET_ASNS
          
          # 将文件所有权交还给 runner，以便上传
          sudo chown -R $USER:$USER .

      # 4. 上传结果
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: asn-scan-results
          path: |
            scanner-src/output_latest.csv
            scanner-src/result.csv
            scanner-src/*.csv
          if-no-files-found: warn
          retention-days: 7

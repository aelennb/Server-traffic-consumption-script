name: ASN CF Proxy Scanner (ASNIPtest-New)

on:
  workflow_dispatch: # 允许手动触发
  schedule:
    - cron: '0 19 * * 2' # 每周三北京时间 03:00 自动运行

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装系统级依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan prips python3 curl jq

      # 2. 克隆项目
      - name: Clone Scanner Repository
        run: |
          git clone --depth 1 https://github.com/122440367/ASNIPtest-New.git scanner-src
          cd scanner-src
          chmod +x *.py 2>/dev/null || true

      # 3. 使用 root 权限运行（彻底解决 masscan 权限问题）
      - name: Run ASN IP Scan
        run: |
          cd scanner-src
          
          # --- 配置区域 ---
          TARGET_ASNS="AS62468"
          # ----------------
          
          echo "开始扫描 ASN: $TARGET_ASNS"
          
          # 核心修复：直接以 root 身份运行脚本
          # 这样里面的 masscan 拥有最高权限，且生成的文件也属于 root
          sudo python3 run.py $TARGET_ASNS
          
          # 关键收尾：把整个目录的属主改回 runner 用户
          # 否则下一步的 upload-artifact 会因为无法读取 root 文件而失败
          sudo chown -R $USER:$USER .

      # 4. 上传结果 CSV
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: asn-scan-results
          path: |
            scanner-src/output_latest.csv
            scanner-src/result.csv
            scanner-src/*.csv
          if-no-files-found: warn
          retention-days: 7

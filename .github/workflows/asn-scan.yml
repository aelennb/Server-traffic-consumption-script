name: ASN CF Proxy Scanner (ASNIPtest-New)

on:
  workflow_dispatch: # 允许手动触发
  schedule:
    - cron: '0 19 * * 2' # 每周三北京时间 03:00 自动运行

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装系统级依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan prips python3 curl jq

      # 2. 克隆并预处理仓库
      - name: Clone Scanner Repository
        run: |
          git clone --depth 1 https://github.com/122440367/ASNIPtest-New.git scanner-src
          cd scanner-src
          
          # 核心修复 1：确保当前 runner 用户对目录有完全读写权限
          chmod -R 777 ./
          
          # 核心修复 2：去除项目内部脚本可能带有的 sudo（避免生成 root 权限文件）
          # 我们通过 setcap 已经赋予了 masscan 权限，不需要 sudo
          find . -type f -name "*.py" -exec sed -i 's/sudo masscan/masscan/g' {} +
          
          chmod +x *.py 2>/dev/null || true

      # 3. 赋予 masscan 底层权限并运行扫描
      - name: Run ASN IP Scan
        run: |
          cd scanner-src
          
          TARGET_ASNS="AS62468" # 替换为你要扫描的 ASN
          echo "开始扫描 ASN: $TARGET_ASNS"
          
          # 赋予 masscan 无需 root 即可发送原始包的权限
          sudo setcap cap_net_raw+ep /usr/bin/masscan
          
          # 正常以 runner 用户运行 Python 脚本
          python3 run.py $TARGET_ASNS

      # 4. 上传结果 CSV
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: asn-scan-results
          path: |
            scanner-src/output_latest.csv
            scanner-src/result.csv
            scanner-src/*.csv
          if-no-files-found: warn
          retention-days: 7
